name: 2 - Publicar aprovados

on:
  schedule:
    - cron: "15 * * * *"     # confere de hora em hora
  workflow_dispatch:
    inputs:
      agora:
        description: "Publicar já as prévias abertas (sem esperar as 4h)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publicar no Instagram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MAKE_WEBHOOK: ${{ secrets.MAKE_WEBHOOK }}
          PUBLICAR_AGORA: ${{ inputs.agora }}
        run: python autopost/publicar.py
