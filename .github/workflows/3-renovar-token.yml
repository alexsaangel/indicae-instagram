name: 3 - Testar conexão com o Instagram

on:
  workflow_dispatch: {}

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir conta
        env:
          T: ${{ secrets.IG_TOKEN }}
          ID: ${{ secrets.IG_USER_ID }}
        run: |
          G=https://graph.facebook.com/v21.0
          echo "== Quem sou eu"; curl -gs "$G/me?fields=id,name&access_token=$T" | jq -c .
          echo "== Permissões"; curl -gs "$G/me/permissions?access_token=$T" | jq -c .
          echo "== Páginas do robô"; curl -gs "$G/me/accounts?fields=id,name,instagram_business_account{id,username}&access_token=$T" | jq -c .
          echo "== Página Indicaê"; curl -gs "$G/1417292088139846?fields=id,name,instagram_business_account,connected_instagram_account&access_token=$T" | jq -c .
          echo "== Conta $ID"; curl -gs "$G/$ID?fields=id,username&access_token=$T" | jq -c .
          echo "== Conta $ID (só id)"; curl -gs "$G/$ID?access_token=$T" | jq -c .
          echo "== Portfólio"; curl -gs "$G/1779636939800028/owned_instagram_accounts?fields=id,username&access_token=$T" | jq -c .
          echo "== Portfólio (v2)"; curl -gs "$G/1779636939800028/instagram_accounts?fields=id,username&access_token=$T" | jq -c .
